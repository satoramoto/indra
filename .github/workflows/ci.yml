name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
          cache: npm

      - run: npm ci
      - name: Prepare the Linux sandbox tests
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          # SRT needs capability-bearing user namespaces on the disposable runner.
          # https://github.com/anthropics/sandbox-runtime#platform-specific-dependencies
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
